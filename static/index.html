<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Financial GraphRAG</title>
<style>
  :root {
    --sidebar-bg: #171717;
    --sidebar-fg: #ececec;
    --sidebar-hover: #2f2f2f;
    --accent: #10a37f;
    --accent-dark: #0d8a6c;
    --page-bg: #ffffff;
    --user-bg: #f4f4f4;
    --text: #0d0d0d;
    --muted: #8e8e8e;
    --tool-fg: #6a1b9a;
    --hitl-bg: #fff8e1;
    --hitl-border: #e0a800;
    --error-fg: #c62828;
    --border: #e5e5e5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); display: flex; }
  /* ---- Sidebar ---- */
  #sidebar { width: 260px; background: var(--sidebar-bg); color: var(--sidebar-fg); display: flex; flex-direction: column; padding: .75rem; gap: .25rem; flex-shrink: 0; }
  #sidebar h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: #9e9e9e; margin: .5rem .5rem .25rem; }
  #newchat { background: transparent; border: 1px solid #4d4d4d; color: var(--sidebar-fg); border-radius: 8px; padding: .6rem; cursor: pointer; font-size: .9rem; text-align: left; }
  #newchat:hover { background: var(--sidebar-hover); }
  #convs { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .conv { padding: .55rem .6rem; border-radius: 8px; cursor: pointer; font-size: .85rem; color: #d5d5d5; display: flex; align-items: center; gap: .4rem; }
  .conv .del { color: #8e8e8e; font-size: 1rem; line-height: 1; padding: 0 .2rem; border-radius: 4px; }
  .conv .del:hover { color: #fff; background: #5f2120; }
  .conv:hover { background: var(--sidebar-hover); }
  .conv.active { background: #2f2f2f; color: #fff; }
  #sidefoot { margin-top: auto; font-size: .72rem; color: #9e9e9e; padding: .5rem; line-height: 1.5; }
  #sidefoot .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4caf50; margin-right: .3rem; }
  /* ---- Main ---- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--page-bg); }
  #topbar { padding: .8rem 1.2rem; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; gap: .5rem; }
  #topbar .badge { font-size: .7rem; font-weight: normal; background: #e8f5e9; color: #2e7d32; border-radius: 20px; padding: .15rem .6rem; }
  #log { flex: 1; overflow-y: auto; padding: 1.2rem; display: flex; flex-direction: column; gap: 1.1rem; max-width: 820px; width: 100%; margin: 0 auto; }
  /* ---- Messages ---- */
  .row { display: flex; gap: .7rem; align-items: flex-start; }
  .row.user { justify-content: flex-end; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: bold; color: #fff; }
  .avatar.agent { background: var(--accent); }
  .bubble { padding: .7rem .95rem; border-radius: 14px; line-height: 1.55; max-width: 100%; overflow-wrap: break-word; }
  .row.user .bubble { background: var(--user-bg); border-bottom-right-radius: 4px; max-width: 80%; }
  .row.agent .bubble { background: transparent; padding-left: 0; flex: 1; min-width: 0; }
  .bubble code { background: #f0f0f0; border-radius: 4px; padding: .1rem .35rem; font-size: .85em; }
  .bubble ul { margin: .4rem 0; padding-left: 1.3rem; }
  .bubble li { margin: .2rem 0; }
  .cite { display: inline-block; background: #e3f2fd; color: #1565c0; border-radius: 6px; padding: .05rem .45rem; font-size: .78em; margin: .1rem .15rem .1rem 0; }
  .bubble a { color: #1565c0; text-decoration: none; font-weight: 600; }
  .bubble a:hover { text-decoration: underline; }
  .steps { font-size: .78rem; color: var(--tool-fg); display: flex; flex-direction: column; gap: .15rem; margin-bottom: .35rem; }
  .step.done::before { content: "✓ "; color: var(--accent); }
  .step.running::before { content: "◌ "; }
  .step.running { animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  .typing { display: inline-flex; gap: 4px; padding: .4rem 0; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: #bdbdbd; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 40% { opacity: .25; } }
  .pbar { margin: .5rem 0; font-size: .82rem; color: #333; }
  .pbar .label { margin-bottom: .25rem; font-weight: 500; }
  .pbar .track { background: #e0e0e0; border-radius: 6px; height: 10px; overflow: hidden; }
  .pbar .fill { background: var(--accent); height: 100%; width: 0%; transition: width .3s ease; border-radius: 6px; }
  .pbar.done .fill { background: #2e7d32; }
  .hitl { background: var(--hitl-bg); border: 1px solid var(--hitl-border); border-radius: 10px; padding: .7rem .9rem; font-size: .85rem; max-width: 90%; }
  .hitl .btns { margin-top: .5rem; display: flex; gap: .5rem; }
  .hitl button { border-radius: 8px; padding: .4rem 1rem; cursor: pointer; font-size: .85rem; }
  .hitl .yes { background: var(--accent); border: 1px solid var(--accent); color: #fff; }
  .hitl .no { background: #fff; border: 1px solid #bbb; }
  .error { color: var(--error-fg); font-weight: bold; }
  .sep { align-self: center; color: var(--muted); font-size: .75rem; }
  /* ---- Hero / suggestions ---- */
  #hero { text-align: center; margin: auto 0; padding: 2rem 1rem; }
  #hero h1 { font-size: 1.7rem; margin-bottom: .3rem; }
  #hero p { color: var(--muted); }
  #sugg { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin-top: 1.2rem; }
  #sugg button { background: #fff; border: 1px solid #ddd; border-radius: 20px; padding: .5rem 1rem; cursor: pointer; font-size: .85rem; color: #333; }
  #sugg button:hover { background: #f4f4f4; }
  /* ---- Composer ---- */
  #composer { padding: 1rem 1.2rem 1.2rem; max-width: 820px; width: 100%; margin: 0 auto; }
  #box { display: flex; gap: .5rem; background: #f4f4f4; border-radius: 24px; padding: .5rem .5rem .5rem 1.2rem; align-items: center; }
  #q { flex: 1; border: none; background: transparent; font-size: 1rem; outline: none; }
  #send { width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 1.1rem; cursor: pointer; }
  #send:hover { background: var(--accent-dark); }
  #send:disabled { background: #bdbdbd; cursor: default; }
  #stop { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #c62828; background: #fff; color: #c62828; font-size: .95rem; cursor: pointer; }
  #stop:disabled { color: #bdbdbd; border-color: #ddd; cursor: default; }
  @media (max-width: 700px) { #sidebar { display: none; } }
</style>
</head>
<body>
<aside id="sidebar">
  <button id="newchat" onclick="newThread()">+ Nuevo chat</button>
  <h2>Conversaciones</h2>
  <div id="convs"></div>
  <div id="sidefoot"><span class="dot"></span>ReAct local · qwen3:8b<br>10-K SEC 2024–2025 · Finnhub</div>
</aside>
<main id="main">
  <div id="topbar">Financial GraphRAG <span class="badge">local</span></div>
  <div id="log"></div>
  <div id="composer">
    <div id="box">
      <input id="q" placeholder="Pregunta lo que sea..." autocomplete="off">
      <button id="send" onclick="ask()" title="Enviar">↑</button>
      <button id="stop" onclick="stopTurn()" title="Detener turno en curso" disabled>■</button>
    </div>
  </div>
</main>
<script>
let thread_id = null;
let busy = false;
const log = document.getElementById('log');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');
const stopBtn = document.getElementById('stop');
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) ask(); });
async function stopTurn() {
  if (!busy || !thread_id) return;
  stopBtn.disabled = true;
  try {
    const res = await fetch('/cancel', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({thread_id})
    });
    if (!res.ok) {
      // p. ej. 404 = servidor viejo sin endpoint /cancel: avisar en vez de fallar en silencio
      const d = document.createElement('div');
      d.className = 'error';
      d.textContent = `No se pudo detener (HTTP ${res.status}). Probablemente el servidor ejecuta código antiguo: reinícialo con el comando del README.`;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
      stopBtn.disabled = false;
    }
  } catch (err) {
    const d = document.createElement('div');
    d.className = 'error';
    d.textContent = 'No se pudo contactar al servidor: ' + err.message;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    stopBtn.disabled = false;
  }
}

/* ---------- conversaciones (servidor, persistentes en disco) ---------- */
async function fetchConvs() {
  try {
    const r = await fetch('/conversations');
    const j = await r.json();
    return j.conversations || [];
  } catch { return []; }
}
async function renderSidebar() {
  const box = document.getElementById('convs');
  box.innerHTML = '';
  for (const c of await fetchConvs()) {
    const d = document.createElement('div');
    d.className = 'conv' + (c.id === thread_id ? ' active' : '');
    d.title = c.title || '';
    const label = document.createElement('span');
    label.textContent = c.title || '(sin título)';
    label.style.cssText = 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
    label.onclick = () => loadConv(c.id);
    const del = document.createElement('span');
    del.textContent = '×';
    del.title = 'Eliminar conversación';
    del.className = 'del';
    del.onclick = async (ev) => {
      ev.stopPropagation();
      if (!confirm('¿Eliminar esta conversación?')) return;
      await fetch('/conversations/' + encodeURIComponent(c.id), {method: 'DELETE'});
      if (c.id === thread_id) { thread_id = null; log.innerHTML = ''; hero(); }
      renderSidebar();
    };
    d.appendChild(label);
    d.appendChild(del);
    box.appendChild(d);
  }
}
function newThread() {
  thread_id = null;
  log.innerHTML = '';
  hero();
  renderSidebar();
  input.focus();
}
async function loadConv(id) {
  thread_id = id;
  log.innerHTML = '';
  renderSidebar();
  try {
    const r = await fetch('/conversations/' + encodeURIComponent(id));
    if (!r.ok) throw 0;
    const conv = await r.json();
    for (const m of conv.messages || []) {
      if (m.role === 'user') addUser(m.text);
      else addStaticAgent(m.text);
    }
  } catch {
    addStaticAgent('(No se pudo cargar esta conversación.)');
  }
}
function addStaticAgent(text) {
  const r = document.createElement('div');
  r.className = 'row agent';
  r.innerHTML = '<div class="avatar agent">FG</div><div style="flex:1;min-width:0"><div class="bubble"></div></div>';
  r.querySelector('.bubble').innerHTML = md(text || '(sin respuesta)');
  log.appendChild(r);
  log.scrollTop = log.scrollHeight;
}

/* ---------- markdown-lite seguro ---------- */
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function md(src) {
  const lines = esc(src).split('\n');
  let html = '', inList = false;
  const inline = s => s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|\W)\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[Source:\s*([^\]]+)\]/g, '<span class="cite">$1</span>');
  for (const ln of lines) {
    const m = ln.match(/^\s*[-•]\s+(.*)/);
    if (m) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += '<li>' + inline(m[1]) + '</li>';
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      if (ln.trim()) html += inline(ln) + '<br>';
    }
  }
  if (inList) html += '</ul>';
  return html || '<br>';
}

/* ---------- mensajes ---------- */
function hero() {
  log.innerHTML =
    '<div id="hero"><h1>¿En qué puedo ayudarte?</h1>' +
    '<p>10-K de la SEC, métricas, precios y noticias — todo en local.</p>' +
    '<div id="sugg">' +
    ['¿En qué segmentos opera MSFT?', '¿A cuánto está AAPL?', 'Noticias recientes de NVDA', 'YoY del revenue de AAPL 2024 vs 2023']
      .map(s => `<button onclick="suggest(this)">${esc(s)}</button>`).join('') +
    '</div></div>';
}
function suggest(btn) { input.value = btn.textContent; ask(); }
function addUser(text) {
  const r = document.createElement('div');
  r.className = 'row user';
  r.innerHTML = '<div class="bubble"></div>';
  r.querySelector('.bubble').textContent = text;
  log.appendChild(r);
  log.scrollTop = log.scrollHeight;
}
function addAgent() {
  const r = document.createElement('div');
  r.className = 'row agent';
  r.innerHTML = '<div class="avatar agent">FG</div><div style="flex:1;min-width:0"><div class="steps"></div><div class="bubble"></div></div>';
  log.appendChild(r);
  log.scrollTop = log.scrollHeight;
  return {
    row: r,
    bubble: r.querySelector('.bubble'),
    steps: r.querySelector('.steps'),
    text: '',
    append(t) { this.text += t; this.bubble.innerHTML = md(this.text); log.scrollTop = log.scrollHeight; },
    tool(name, running) {
      let el = this.steps.querySelector(`[data-tool="${CSS.escape(name)}"]`);
      if (!el) {
        el = document.createElement('div');
        el.className = 'step';
        el.dataset.tool = name;
        el.textContent = name;
        this.steps.appendChild(el);
      }
      el.classList.toggle('running', !!running);
      el.classList.toggle('done', !running);
    },
    progress(p) {
      // Una barra por año: ticker + year como clave.
      const key = (p.ticker || '?') + '_' + (p.year || '?');
      let el = this.steps.querySelector(`[data-pbar="${CSS.escape(key)}"]`);
      if (!el) {
        el = document.createElement('div');
        el.className = 'pbar';
        el.dataset.pbar = key;
        el.innerHTML = '<div class="label"></div><div class="track"><div class="fill"></div></div>';
        this.steps.appendChild(el);
      }
      const total = Math.max(1, p.total || 1), done = Math.min(p.done || 0, total);
      const phaseTxt = {
        download: 'descargando 10-K',
        parse: 'analizando filing',
        chunks: 'chunks listos',
        cache: 'comprobando caché',
        extract: 'extrayendo tripletas',
        index: 'indexando grafo y vectores',
        done: 'completado'
      }[p.phase] || p.phase || '';

      let pct = 0;
      if (p.phase === 'download') {
        pct = 5;
      } else if (p.phase === 'parse') {
        pct = 5 + Math.round(10 * done / total);
      } else if (p.phase === 'chunks') {
        pct = 15;
      } else if (p.phase === 'cache') {
        pct = 15 + Math.round(15 * done / total);
      } else if (p.phase === 'extract') {
        pct = 20 + Math.round(75 * done / total);
      } else if (p.phase === 'index') {
        pct = 95 + Math.round(4 * done / total);
      } else if (p.phase === 'done') {
        pct = 100;
      } else {
        pct = Math.round(100 * done / total);
      }
      pct = Math.max(0, Math.min(100, pct));

      const isDone = p.phase === 'done' || pct >= 100;
      let countTxt = '';
      if (p.phase === 'extract' || p.phase === 'cache') {
        countTxt = ` · ${done}/${total}`;
      } else if (p.phase === 'chunks' || p.phase === 'done') {
        countTxt = ` · ${total} chunks`;
      }
      el.querySelector('.label').textContent = `${p.ticker || ''} ${p.year || ''} · ${phaseTxt}${countTxt} (${pct}%)`;
      el.querySelector('.fill').style.width = pct + '%';
      el.classList.toggle('done', isDone);
      log.scrollTop = log.scrollHeight;
    },
    typing(on) {
      let el = this.bubble.querySelector('.typing');
      if (on && !el) {
        el = document.createElement('div');
        el.className = 'typing';
        el.innerHTML = '<span></span><span></span><span></span>';
        this.bubble.appendChild(el);
      } else if (!on && el) el.remove();
      log.scrollTop = log.scrollHeight;
    }
  };
}
function addHitl(notice, question, parentEl = null) {
  const d = document.createElement('div');
  d.className = 'hitl';
  const p = document.createElement('div');
  p.textContent = notice;
  const btns = document.createElement('div');
  btns.className = 'btns';
  const yes = document.createElement('button');
  yes.className = 'yes'; yes.textContent = 'Confirmar';
  const no = document.createElement('button');
  no.className = 'no'; no.textContent = 'Cancelar';
  btns.appendChild(yes); btns.appendChild(no);
  d.appendChild(p); d.appendChild(btns);
  (parentEl || log).appendChild(d);
  log.scrollTop = log.scrollHeight;
  return new Promise(resolve => {
    const settle = (value, label) => {
      btns.remove();
      const note = document.createElement('div');
      note.style.cssText = 'font-size:.8rem;color:#555;margin-top:.35rem;';
      note.textContent = label;
      d.appendChild(note);
      log.scrollTop = log.scrollHeight;
      resolve(value);
    };
    yes.onclick = () => settle(true, '(confirmado, ejecutando...)');
    no.onclick = () => settle(false, '(cancelado)');
  });
}

/* ---------- turno ---------- */
async function ask() {
  const question = input.value.trim();
  if (!question || busy) return;
  busy = true; sendBtn.disabled = true; stopBtn.disabled = false;
  input.value = '';
  if (document.getElementById('hero')) log.innerHTML = '';
  addUser(question);
  const agent = addAgent();
  agent.typing(true);
  try {
    const res = await fetch('/query', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question, thread_id})
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', ev = null;
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        let data = null;
        for (const line of block.split('\n')) {
          if (line.startsWith('event: ')) ev = line.slice(7).trim();
          else if (line.startsWith('data: ')) data = JSON.parse(line.slice(6));
        }
        if (ev === 'start') { thread_id = data.thread_id; renderSidebar(); }
        else if (ev === 'token') { agent.typing(false); agent.append(data.text); }
        else if (ev === 'tool') { agent.tool(data.name, true); }
        else if (ev === 'progress') { agent.typing(false); agent.progress(data); }
        else if (ev === 'interrupt') {
          agent.typing(false);
          const ok = await addHitl(data.notice, data.question, agent.steps).then(v => v);
          // marca el step como resuelto y confirma en el backend
          agent.tool('confirm', false);
          await fetch('/confirm', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({thread_id, decision: ok ? 'y' : 'n'})
          });
        }
        else if (ev === 'done') {
          agent.typing(false);
          for (const el of agent.steps.querySelectorAll('.step')) { el.classList.remove('running'); el.classList.add('done'); }
          for (const el of agent.steps.querySelectorAll('.pbar')) {
            el.classList.add('done');
            const fill = el.querySelector('.fill');
            if (fill) fill.style.width = '100%';
          }
          renderSidebar();
        }
        else if (ev === 'error') { agent.typing(false); agent.append('\n**ERROR:** ' + data.message); }
        else if (ev === 'cancelled') {
          agent.typing(false);
          for (const el of agent.steps.querySelectorAll('.step')) { el.classList.remove('running'); el.classList.add('done'); }
          for (const el of agent.steps.querySelectorAll('.pbar')) {
            const fill = el.querySelector('.fill');
            if (fill) fill.style.background = '#e65100';
            const lbl = el.querySelector('.label');
            if (lbl && !lbl.textContent.includes('pausado')) lbl.textContent += ' · pausado (guardado)';
          }
          agent.append('\n*(detenido por el usuario — progreso guardado: pide "continúa la ingesta" para retomar)*');
        }
      }
    }
  } catch (err) {
    agent.typing(false);
    agent.append('\n**ERROR de conexión:** ' + err.message);
  }
  busy = false; sendBtn.disabled = false; stopBtn.disabled = true;
  input.focus();
}

hero();
renderSidebar();
</script>
</body>
</html>
